
<div hx-swap-oob="delete:#empty-chat"></div>

<div hx-swap-oob="beforeend:#messages">
    <article class="message {% if message.username == current_username %}message-own{% else %}message-received{% endif %}">

        <div class="message-avatar">
            {{ message.username[0]|upper }}
        </div>

        <div class="message-content">

            <div class="message-meta">
                <strong>{{ message.username }}</strong>
                <small>{{ message.created_at }}</small>
            </div>

            {% if message.image_path %}
                <div class="message-bubble image-bubble">
                    <img
                        src="{{ message.image_path }}"
                        alt="Image envoyée par {{ message.username }}"
                        class="chat-image"
                    >
                </div>
            {% else %}
                <div class="message-bubble">
                    {{ message.content }}
                </div>
            {% endif %}

        </div>
    </article>
</div>
